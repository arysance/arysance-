<!DOCTYPE html>
<html>
<head>
    <title>Thank You | Arysance</title>
    <style>
        body {
            font-family: 'Josefin Sans', sans-serif;
            text-align: center;
            padding: 50px;
            background: #f9f9f9;
        }
        .success-icon {
            color: #4CAF50;
            font-size: 60px;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #556B8E;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="success-icon">✓</div>
    <h1>Order Confirmed!</h1>
    <p>Your order <strong id="order-id"></strong> has been received.</p>
    <p>We've sent payment instructions to your email.</p>
    <a href="index.html" class="btn">Back to Home</a>

    <script>
        // Show order ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('order-id').textContent = urlParams.get('order');
    </script>
</body>
</html>
